name: Lint shell scripts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bootstrap'
          check_together: true
